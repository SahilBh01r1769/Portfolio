name: portfolio checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate static site
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          required = [
              'index.html',
              'styles.css',
              'styles/about.css',
              'app.js',
              'data/projects.js',
              'data/articles.js',
              'resume.pdf',
          ]
          for path in required:
              assert Path(path).is_file(), f'Missing {path}'

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
                  self.scripts = []
                  self.stylesheets = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'a' and attrs.get('href'):
                      self.hrefs.append(attrs['href'])
                  if tag == 'script' and attrs.get('src'):
                      self.scripts.append(attrs['src'])
                  if tag == 'link' and attrs.get('rel') == 'stylesheet' and attrs.get('href'):
                      self.stylesheets.append(attrs['href'])

          html = Path('index.html').read_text(encoding='utf-8')
          projects = Path('data/projects.js').read_text(encoding='utf-8')
          articles = Path('data/articles.js').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          parser = Parser()
          parser.feed(html)

          assert '9.43' in html, 'Current CGPA missing'
          assert '80.5%' in html, 'Current HSC percentage missing'
          assert '9.744' not in html, 'Old CGPA still present'
          assert '92% OCR' not in projects, 'Unsupported OCR metric still present'
          assert '15–30 FPS' not in projects, 'Unsupported FPS claim still present'

          assert parser.scripts[-3:] == ['data/projects.js', 'data/articles.js', 'app.js'], 'Data modules must load before app.js'
          assert 'styles/about.css' in parser.stylesheets, 'About stylesheet missing'
          assert 'PORTFOLIO_PROJECTS' in projects and 'PORTFOLIO_ARTICLES' in articles, 'Portfolio data globals missing'
          assert 'renderContent()' in app, 'Portfolio render bootstrap missing'

          repos = [
              'serverless-receipt-processor',
              'violence_detection',
              'metropt3-predictive-maintenance',
              'aws-audio-transcription-sentiment',
              'image-captioning',
              'textscope-nlp',
              'indo_european_gods',
          ]
          demos = [
              'https://sahilbh01r1769.github.io/indo_european_gods/',
              'https://nlp-webapp.streamlit.app/',
              'https://image-captioningdemo.streamlit.app/',
              'https://metropt3-predictive-maintenance.streamlit.app/',
              'https://d3uo3z77ak8ix1.cloudfront.net/',
              'https://violencedetectionai.streamlit.app/',
              'https://d2h6neawct2uig.cloudfront.net/',
          ]
          for value in repos + demos:
              assert value in projects, f'Missing project data: {value}'

          assert projects.count("id: '") == 7, 'Expected seven project records'
          assert articles.count("number: '") >= 4, 'Expected at least four article records'
          assert 'https://medium.com/@sahilbhoir151' in articles, 'Medium article links missing'
          assert 'resume.pdf' in parser.hrefs, 'Resume link missing'
          print('Validated modular portfolio data, rendering hooks, seven projects and writing links.')
          PY
